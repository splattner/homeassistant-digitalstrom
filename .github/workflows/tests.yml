name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pytest-homeassistant-custom-component needs the python version of
          # the current Home Assistant release
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        run: pip install -r requirements_test.txt ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest --cov=custom_components --cov-report=term-missing
